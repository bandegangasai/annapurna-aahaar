<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Annapurna Aahaar | Traditional Indian Food Products</title>
    <script type="text/javascript">
      // Dynamic Single Page App redirect for both custom domain (annapurnaaahaar.in) and GitHub Pages fallback
      var l = window.location;
      var pathSegmentsToKeep = l.hostname.indexOf('github.io') > -1 ? 1 : 0;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
    <style>
      body {
        background-color: #F8F3E7;
        font-family: Georgia, serif;
        color: #173F35;
        text-align: center;
        padding: 60px 20px;
      }
      h1 { font-size: 32px; margin-bottom: 12px; }
      p { font-size: 16px; color: #4b5563; }
      a { color: #C79A45; font-weight: bold; text-decoration: underline; }
    </style>
  </head>
  <body>
    <h1>Annapurna Aahaar</h1>
    <p>Redirecting to authentic traditional food catalogue...</p>
    <p>If you are not redirected automatically, please <a href="./">click here to return home</a>.</p>
  </body>
</html>
