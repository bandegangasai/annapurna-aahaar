services:
  # Annapurna Aahaar Backend API Service
  - type: web
    name: annapurna-aahaar-api
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: annapurna-aahaar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

# Managed PostgreSQL Database
databases:
  - name: annapurna-aahaar-db
    plan: free
    region: singapore
    databaseName: annapurna_db
    user: annapurna_admin
