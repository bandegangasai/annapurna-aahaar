<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="noodleBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="65%" stop-color="#F5E5C9"/>
      <stop offset="100%" stop-color="#DEBE92"/>
    </radialGradient>
    <linearGradient id="brassBowlNoodle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89B3C"/>
      <stop offset="60%" stop-color="#8C6517"/>
      <stop offset="100%" stop-color="#4F3605"/>
    </linearGradient>
    <linearGradient id="hakkaStrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#ECC675"/>
      <stop offset="100%" stop-color="#BA8C32"/>
    </linearGradient>
    <filter id="noodleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4D2B05" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#noodleBg)"/>
  <circle cx="300" cy="285" r="255" stroke="#C89B3C" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.4"/>

  <!-- Antique Brass Platter with Long Whole Wheat Noodles -->
  <g filter="url(#noodleShadow)">
    <circle cx="300" cy="310" r="175" fill="url(#brassBowlNoodle)"/>
    <circle cx="300" cy="310" r="160" fill="#3D2904" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="300" cy="310" r="145" fill="#241701"/>

    <!-- Long Curled Hakka Noodle Strands -->
    <g stroke="url(#hakkaStrand)" stroke-width="4.0" stroke-linecap="round" fill="none">
      <path d="M190 310 C210 240, 270 240, 290 310 S370 380, 410 310" />
      <path d="M200 280 C240 360, 280 230, 330 330 S390 260, 400 330" />
      <path d="M185 330 C220 270, 280 370, 320 280 S380 340, 415 290" />
      <path d="M210 350 C260 250, 310 350, 360 270 S400 360, 390 280" />
      <path d="M220 260 C250 340, 300 270, 350 350 S390 280, 380 340" />

      <!-- Foreground Golden Strands -->
      <path d="M210 300 Q280 220 330 310 T400 310" stroke="#FFF7E0" stroke-width="3"/>
      <path d="M195 320 Q260 380 340 300 T395 320" stroke="#FFE9A8" stroke-width="3"/>
      <path d="M230 270 Q300 340 370 270" stroke="#FFF9EB" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Premium Label / Emblem -->
  <g transform="translate(300, 520)">
    <rect x="-105" y="-22" width="210" height="44" rx="22" fill="#4A0E17" stroke="#C89B3C" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="bold" font-size="16" fill="#FDF8F0" letter-spacing="1.5">
      DESI NOODLES
    </text>
  </g>
</svg>
