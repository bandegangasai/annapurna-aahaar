<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="moongBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFBEF"/>
      <stop offset="70%" stop-color="#EFF0CD"/>
      <stop offset="100%" stop-color="#D7DA9E"/>
    </radialGradient>
    <radialGradient id="moongPapad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFEE6"/>
      <stop offset="60%" stop-color="#F6F3BA"/>
      <stop offset="90%" stop-color="#E1DD90"/>
      <stop offset="100%" stop-color="#C5BE6C"/>
    </radialGradient>
    <filter id="papadShadowMoong" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3D3A0A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#moongBg)"/>
  <circle cx="300" cy="290" r="255" stroke="#C89B3C" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.4"/>

  <!-- Back Stacked Moong Papad -->
  <g filter="url(#papadShadowMoong)" transform="translate(330, 250) rotate(20)">
    <circle cx="0" cy="0" r="148" fill="#E8E3A1"/>
    <circle cx="0" cy="0" r="145" stroke="#A9A149" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.6"/>
  </g>

  <!-- Main Hero Moong Dal Papad -->
  <g filter="url(#papadShadowMoong)" transform="translate(300, 310)">
    <circle cx="0" cy="0" r="162" fill="url(#moongPapad)"/>
    <circle cx="0" cy="0" r="158" stroke="#A9A149" stroke-width="3" stroke-dasharray="10 4" fill="none" opacity="0.7"/>

    <!-- Subtle Moong Pulse Flecks & Cracked Spices -->
    <g fill="#4A4513" opacity="0.7">
      <circle cx="-70" cy="-30" r="2.5"/>
      <circle cx="-35" cy="-80" r="2.2"/>
      <circle cx="30" cy="-60" r="2.8"/>
      <circle cx="85" cy="-20" r="2.4"/>
      <circle cx="-15" cy="25" r="3.0"/>
      <circle cx="55" cy="30" r="2.6"/>
      <circle cx="-65" cy="70" r="2.3"/>
      <circle cx="20" cy="85" r="2.8"/>
      <circle cx="75" cy="75" r="2.5"/>
      <circle cx="-95" cy="35" r="2.0"/>
    </g>

    <!-- Crisp Sun Bubbles -->
    <circle cx="-40" cy="-50" r="14" fill="#FFFDE0" opacity="0.6"/>
    <circle cx="60" cy="40" r="16" fill="#FFFDE0" opacity="0.6"/>
    <circle cx="-20" cy="60" r="12" fill="#EAE698" opacity="0.5"/>
  </g>

  <!-- Premium Label / Emblem -->
  <g transform="translate(300, 520)">
    <rect x="-135" y="-22" width="270" height="44" rx="22" fill="#4A0E17" stroke="#C89B3C" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="bold" font-size="16" fill="#FDF8F0" letter-spacing="1.5">
      MOONG DAL PAPAD
    </text>
  </g>
</svg>
