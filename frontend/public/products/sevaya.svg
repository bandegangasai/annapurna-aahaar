<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF4E4"/>
      <stop offset="70%" stop-color="#EEDBB7"/>
      <stop offset="100%" stop-color="#D7BD8B"/>
    </radialGradient>
    <linearGradient id="woodPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C4A1E"/>
      <stop offset="50%" stop-color="#5E2C0C"/>
      <stop offset="100%" stop-color="#3D1A04"/>
    </linearGradient>
    <linearGradient id="wheatStrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="50%" stop-color="#E4BD68"/>
      <stop offset="100%" stop-color="#C28C2C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#3B1804" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <circle cx="300" cy="300" r="260" stroke="#C89B3C" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="300" cy="300" r="240" stroke="#9A3412" stroke-width="0.8" opacity="0.25"/>

  <!-- Antique Brass / Wooden Plate -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="315" r="190" fill="url(#woodPlate)"/>
    <circle cx="300" cy="315" r="175" fill="#4A1E06" stroke="#C89B3C" stroke-width="3"/>
    <circle cx="300" cy="315" r="160" fill="#2E1102"/>
  </g>

  <!-- Wheat Sevaya / Vermicelli Strands Pile -->
  <g stroke="url(#wheatStrand)" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- Base Layer Strands -->
    <path d="M190 320 Q240 260 310 290 T410 320" />
    <path d="M200 340 Q270 280 340 310 T400 330" />
    <path d="M180 300 Q260 250 330 280 T420 300" />
    <path d="M210 280 Q280 340 350 270 T390 340" />
    <path d="M195 310 Q250 350 320 300 T405 315" />
    
    <!-- Cross Strands & Bundles -->
    <path d="M220 270 Q300 240 360 290 T380 350" />
    <path d="M210 330 Q290 290 360 320 T395 290" />
    <path d="M230 290 Q270 240 340 280 T370 330" stroke-width="4"/>
    <path d="M190 330 Q280 360 350 300 T410 280" />
    <path d="M215 305 Q305 275 375 315 T385 285" />
    
    <!-- Foreground Delicate Crisp Strands -->
    <path d="M225 285 Q265 335 335 285 T375 315" stroke="#FFF3D4" stroke-width="2.5"/>
    <path d="M205 315 Q275 265 345 305 T395 315" stroke="#FFE7A3" stroke-width="2.5"/>
    <path d="M240 275 Q310 315 360 275 T380 325" stroke="#FFF8E7" stroke-width="2"/>
    <path d="M195 295 Q255 335 325 285 T405 305" stroke="#E5B955" stroke-width="3"/>
  </g>

  <!-- Wheat Ears Decoration on Side -->
  <g transform="translate(110, 110) rotate(-35)" fill="#D4AF37" opacity="0.85">
    <path d="M0 0 Q10 -30 20 -50 Q5 -30 0 0 Z"/>
    <path d="M-5 -15 Q-20 -35 -25 -55 Q-10 -35 -5 -15 Z"/>
    <path d="M5 -30 Q20 -50 25 -70 Q10 -50 5 -30 Z"/>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#C89B3C" stroke-width="3"/>
  </g>

  <!-- Premium Label / Emblem -->
  <g transform="translate(300, 510)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#4A0E17" stroke="#C89B3C" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="bold" font-size="16" fill="#FDF8F0" letter-spacing="1.5">
      TRADITIONAL WHEAT SEVAYA
    </text>
  </g>
</svg>
