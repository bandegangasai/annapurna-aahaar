<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="masalaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF7EE"/>
      <stop offset="70%" stop-color="#F2DDC5"/>
      <stop offset="100%" stop-color="#DBB894"/>
    </radialGradient>
    <radialGradient id="masalaPapad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF3E2"/>
      <stop offset="60%" stop-color="#EED1AB"/>
      <stop offset="85%" stop-color="#D9A979"/>
      <stop offset="100%" stop-color="#B87C44"/>
    </radialGradient>
    <filter id="papadShadowMasala" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4A1E0B" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#masalaBg)"/>
  <circle cx="300" cy="290" r="255" stroke="#C89B3C" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.4"/>

  <!-- Back Stacked Papad -->
  <g filter="url(#papadShadowMasala)" transform="translate(340, 250) rotate(18)">
    <circle cx="0" cy="0" r="148" fill="#D9A979"/>
    <circle cx="0" cy="0" r="145" stroke="#8E4E1C" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.6"/>
  </g>

  <!-- Main Hero Masala Papad with visible red chili flakes & whole cumin -->
  <g filter="url(#papadShadowMasala)" transform="translate(300, 310)">
    <circle cx="0" cy="0" r="162" fill="url(#masalaPapad)"/>
    <circle cx="0" cy="0" r="158" stroke="#8E4E1C" stroke-width="3" stroke-dasharray="10 4" fill="none" opacity="0.7"/>

    <!-- Red Chili Flakes (Lal Mirch) -->
    <g fill="#B91C1C" opacity="0.85">
      <path d="M-60 -40 Q-55 -45 -50 -42 Q-55 -38 -60 -40 Z" />
      <path d="M40 -70 Q45 -75 52 -70 Q46 -65 40 -70 Z" />
      <path d="M80 30 Q86 25 90 32 Q84 36 80 30 Z" />
      <path d="M-30 60 Q-25 55 -20 62 Q-26 66 -30 60 Z" />
      <path d="M20 90 Q25 85 30 92 Q24 96 20 90 Z" />
      <path d="M-80 20 Q-75 15 -70 22 Q-76 26 -80 20 Z" />
      <path d="M-10 -90 Q-5 -95 0 -88 Q-6 -84 -10 -90 Z" />
    </g>

    <!-- Whole Cumin Seeds (Jeera) -->
    <g fill="#45240B" stroke="#2B1405" stroke-width="0.5">
      <ellipse cx="-45" cy="-75" rx="5.5" ry="2" transform="rotate(35 -45 -75)"/>
      <ellipse cx="65" cy="-35" rx="6.0" ry="2.2" transform="rotate(-40 65 -35)"/>
      <ellipse cx="-20" cy="20" rx="5.8" ry="2.1" transform="rotate(15 -20 20)"/>
      <ellipse cx="50" cy="50" rx="6.2" ry="2.0" transform="rotate(65 50 50)"/>
      <ellipse cx="-70" cy="45" rx="5.2" ry="1.9" transform="rotate(-25 -70 45)"/>
      <ellipse cx="10" cy="-40" rx="5.6" ry="2.0" transform="rotate(80 10 -40)"/>
      <ellipse cx="90" cy="-10" rx="5.4" ry="2.1" transform="rotate(-15 90 -10)"/>
      <ellipse cx="-5" cy="80" rx="6.0" ry="2.2" transform="rotate(45 -5 80)"/>
      <ellipse cx="-90" cy="-15" rx="5.0" ry="1.8" transform="rotate(-60 -90 -15)"/>
    </g>

    <!-- Black Peppercorns -->
    <g fill="#1F130A">
      <circle cx="-35" cy="-25" r="3.5"/>
      <circle cx="35" cy="-60" r="3.2"/>
      <circle cx="70" cy="15" r="3.8"/>
      <circle cx="-15" cy="50" r="3.0"/>
      <circle cx="45" cy="85" r="3.6"/>
      <circle cx="-55" cy="80" r="3.1"/>
    </g>
  </g>

  <!-- Premium Label / Emblem -->
  <g transform="translate(300, 520)">
    <rect x="-125" y="-22" width="250" height="44" rx="22" fill="#4A0E17" stroke="#C89B3C" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="bold" font-size="16" fill="#FDF8F0" letter-spacing="1.5">
      SPICY MASALA PAPAD
    </text>
  </g>
</svg>
